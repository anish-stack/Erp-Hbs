upstream erp_gateway {
    server api-gateway:4000;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=erp_api:10m rate=30r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 60m;
    client_body_timeout 60s;
    keepalive_timeout 65s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain application/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /health {
        proxy_pass http://erp_gateway/health;
        access_log off;
    }

    location / {
        limit_req zone=erp_api burst=60 nodelay;

        proxy_pass http://erp_gateway;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
